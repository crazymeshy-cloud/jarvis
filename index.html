<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS — שליטה בידיים</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#9ff}
  video{display:none}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at center,#012 0%,#000 70%);z-index:5;text-align:center;padding:20px}
  #start h1{margin:0;font-size:42px;letter-spacing:8px;color:#5ff;text-shadow:0 0 18px #0ff}
  #start p{margin:0;color:#8cc;max-width:420px;line-height:1.6}
  button{font:inherit;font-weight:700;border:1px solid #0ff;background:rgba(0,255,255,.1);color:#aff;border-radius:10px;padding:12px 26px;font-size:18px;cursor:pointer;box-shadow:0 0 12px rgba(0,255,255,.4)}
  #bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:none;gap:10px;z-index:4}
  #bar button{font-size:15px;padding:8px 16px}
  #status{position:fixed;top:12px;left:12px;z-index:4;font:600 13px ui-monospace,monospace;color:#6ff;direction:ltr;text-shadow:0 0 6px #0ff}
</style>
</head>
<body>
<video id="video" playsinline autoplay muted></video>
<canvas id="c"></canvas>
<div id="status"></div>

<div id="start">
  <h1>J.A.R.V.I.S</h1>
  <p>תרים יד מול המצלמה.<br>🤏 <b>צביטה</b> (אגודל + אצבע מורה) = תפיסת כדור.<br>תזיז את היד כדי להזיז אותו, ותפתח את האצבעות כדי לשחרר. אם תשחרר תוך כדי תנועה, הוא נזרק.<br>☝️ אפשר גם לדחוף כדורים עם קצה האצבע.</p>
  <button id="go">הפעל מערכת</button>
  <p id="err" style="color:#f88"></p>
</div>

<div id="bar">
  <button id="add">➕ כדור</button>
  <button id="reset">↺ איפוס</button>
  <button id="cam">📷 הסתר/הצג מצלמה</button>
</div>

<script type="module">
import {FilesetResolver, HandLandmarker} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video=document.getElementById('video'), cv=document.getElementById('c'), ctx=cv.getContext('2d');
const status=document.getElementById('status');
let W,H,DPR, landmarker, showCam=true;

function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();

/* ---------- balls ---------- */
const COLORS=['#00f0ff','#ff3d7f','#ffd23d','#7dff6b','#b47dff','#ff8a3d'];
let balls=[];
function makeBall(i){
  const r=Math.min(W,H)*(0.05+Math.random()*0.03);
  return {x:W*(0.2+Math.random()*0.6),y:H*(0.2+Math.random()*0.5),vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,r,
          color:COLORS[i%COLORS.length],held:null,phase:Math.random()*6};
}
function reset(){balls=[];for(let i=0;i<6;i++)balls.push(makeBall(i));}
reset();

/* ---------- hands ---------- */
const hands=[{},{}]; // per-hand state: pinching, ball, history
const CONN=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

function mapPt(lm){
  const vw=video.videoWidth,vh=video.videoHeight,s=Math.max(W/vw,H/vh);
  const ox=(W-vw*s)/2, oy=(H-vh*s)/2;
  return {x:W-(lm.x*vw*s+ox), y:lm.y*vh*s+oy};   // mirrored
}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

function handleHands(res){
  const seen=new Set();
  (res.landmarks||[]).forEach((lms,hi)=>{
    if(hi>1)return; seen.add(hi);
    const P=lms.map(mapPt), h=hands[hi];
    const size=dist(P[0],P[9])||1;
    const pinchD=dist(P[4],P[8])/size;
    const pinch={x:(P[4].x+P[8].x)/2,y:(P[4].y+P[8].y)/2};
    h.P=P; h.pinchPt=pinch;
    // smoothing
    h.sx=h.sx==null?pinch.x:h.sx*0.5+pinch.x*0.5;
    h.sy=h.sy==null?pinch.y:h.sy*0.5+pinch.y*0.5;
    const now=performance.now();
    h.hist=(h.hist||[]).concat([{x:h.sx,y:h.sy,t:now}]).filter(p=>now-p.t<120);

    if(!h.pinching && pinchD<0.32){
      h.pinching=true;
      // grab nearest free ball
      let best=null,bd=1e9;
      for(const b of balls){ if(b.held!=null)continue; const d=Math.hypot(b.x-h.sx,b.y-h.sy); if(d<b.r*1.8&&d<bd){bd=d;best=b;} }
      if(best){best.held=hi;h.ball=best;h.offX=best.x-h.sx;h.offY=best.y-h.sy;}
    } else if(h.pinching && pinchD>0.48){
      release(h);
    }
    if(h.ball){
      const b=h.ball; const tx=h.sx+h.offX*0.8, ty=h.sy+h.offY*0.8;
      b.vx=(tx-b.x); b.vy=(ty-b.y); b.x=tx; b.y=ty; h.offX*=0.8; h.offY*=0.8;
    }
    // fingertip push (index tip)
    if(!h.ball){
      const tip=P[8];
      for(const b of balls){ if(b.held!=null)continue;
        const d=Math.hypot(b.x-tip.x,b.y-tip.y), min=b.r+10;
        if(d<min&&d>0){const nx=(b.x-tip.x)/d,ny=(b.y-tip.y)/d; b.x=tip.x+nx*min; b.y=tip.y+ny*min; b.vx+=nx*6; b.vy+=ny*6;}
      }
    }
  });
  [0,1].forEach(i=>{ if(!seen.has(i)){ release(hands[i]); hands[i].P=null; hands[i].sx=null; hands[i].hist=[]; } });
}
function release(h){
  if(h.ball){
    const hs=h.hist||[];
    if(hs.length>1){const a=hs[0],z=hs[hs.length-1],dt=Math.max(16,z.t-a.t);h.ball.vx=(z.x-a.x)/dt*16;h.ball.vy=(z.y-a.y)/dt*16;}
    h.ball.held=null;
  }
  h.ball=null;h.pinching=false;
}

/* ---------- physics ---------- */
function physics(){
  for(const b of balls){
    if(b.held!=null)continue;
    b.vx*=0.985;b.vy*=0.985;b.vy+=0.12;          // light gravity
    b.x+=b.vx;b.y+=b.vy;
    if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*0.8;} if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)*0.8;}
    if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)*0.8;} if(b.y>H-b.r){b.y=H-b.r;b.vy=-Math.abs(b.vy)*0.7;}
  }
  for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){
    const a=balls[i],b=balls[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=a.r+b.r;
    if(d<m&&d>0){
      const nx=dx/d,ny=dy/d,o=(m-d)/2;
      if(a.held==null){a.x-=nx*o;} if(b.held==null){b.x+=nx*o;}
      if(a.held==null){a.y-=ny*o;} if(b.held==null){b.y+=ny*o;}
      const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
      if(rv<0){const imp=-rv*0.9; if(a.held==null){a.vx-=imp*nx;a.vy-=imp*ny;} if(b.held==null){b.vx+=imp*nx;b.vy+=imp*ny;}}
    }
  }
}

/* ---------- drawing ---------- */
function drawVideo(){
  if(!showCam||!video.videoWidth){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);return;}
  const vw=video.videoWidth,vh=video.videoHeight,s=Math.max(W/vw,H/vh);
  ctx.save();ctx.translate(W,0);ctx.scale(-1,1);
  ctx.drawImage(video,(W-vw*s)/2,(H-vh*s)/2,vw*s,vh*s);ctx.restore();
  ctx.fillStyle='rgba(0,10,20,0.55)';ctx.fillRect(0,0,W,H);
}
function drawGrid(t){
  ctx.strokeStyle='rgba(0,255,255,0.06)';ctx.lineWidth=1;
  const g=50;for(let x=(t*0.01)%g;x<W;x+=g){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=g){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
}
function drawBall(b,t){
  const glow=b.held!=null?40:22;
  ctx.save();ctx.shadowColor=b.color;ctx.shadowBlur=glow;
  const gr=ctx.createRadialGradient(b.x-b.r*.3,b.y-b.r*.3,b.r*.1,b.x,b.y,b.r);
  gr.addColorStop(0,'#fff');gr.addColorStop(0.25,b.color);gr.addColorStop(1,'rgba(0,0,0,0.2)');
  ctx.fillStyle=gr;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.restore();
  // HUD rings
  ctx.strokeStyle=b.color;ctx.lineWidth=2;ctx.globalAlpha=0.7;
  const rot=t*0.002+b.phase;
  ctx.beginPath();ctx.arc(b.x,b.y,b.r*1.3,rot,rot+Math.PI*0.6);ctx.stroke();
  ctx.beginPath();ctx.arc(b.x,b.y,b.r*1.3,rot+Math.PI,rot+Math.PI*1.6);ctx.stroke();
  if(b.held!=null){ctx.globalAlpha=0.4;ctx.beginPath();ctx.arc(b.x,b.y,b.r*1.6+Math.sin(t*0.01)*4,0,Math.PI*2);ctx.stroke();}
  ctx.globalAlpha=1;
}
function drawHands(t){
  for(const h of hands){
    if(!h.P)continue;const P=h.P;
    ctx.save();ctx.strokeStyle='rgba(0,255,255,0.8)';ctx.lineWidth=2;ctx.shadowColor='#0ff';ctx.shadowBlur=10;
    for(const [a,b] of CONN){ctx.beginPath();ctx.moveTo(P[a].x,P[a].y);ctx.lineTo(P[b].x,P[b].y);ctx.stroke();}
    ctx.fillStyle='#aff';for(const p of P){ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();}
    // pinch cursor
    const c=h.pinchPt, on=h.pinching;
    ctx.strokeStyle=on?'#ff3d7f':'#0ff';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(c.x,c.y,on?10:18,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(c.x,c.y,26,t*0.004,t*0.004+1.2);ctx.stroke();
    ctx.restore();
  }
}

let lastVT=-1, fps=0, fT=performance.now(), fN=0;
function loop(t){
  if(landmarker&&video.readyState>=2&&video.currentTime!==lastVT){
    lastVT=video.currentTime;
    try{handleHands(landmarker.detectForVideo(video,performance.now()));}catch(e){}
  }
  physics();
  drawVideo();drawGrid(t);
  for(const b of balls)drawBall(b,t);
  drawHands(t);
  fN++;if(t-fT>1000){fps=fN;fN=0;fT=t;}
  const nH=hands.filter(h=>h.P).length;
  status.textContent=`SYS ONLINE  |  HANDS: ${nH}  |  OBJECTS: ${balls.length}  |  ${fps} FPS`;
  requestAnimationFrame(loop);
}

/* ---------- start ---------- */
document.getElementById('go').onclick=async()=>{
  const err=document.getElementById('err'), btn=document.getElementById('go');
  btn.textContent='טוען...';btn.disabled=true;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});
    video.srcObject=stream;await video.play();
    const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const opts=d=>({baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",delegate:d},runningMode:"VIDEO",numHands:2,minHandDetectionConfidence:0.6,minTrackingConfidence:0.5});
    try{landmarker=await HandLandmarker.createFromOptions(vision,opts("GPU"));}
    catch(e){landmarker=await HandLandmarker.createFromOptions(vision,opts("CPU"));}
    document.getElementById('start').style.display='none';
    document.getElementById('bar').style.display='flex';
  }catch(e){
    btn.textContent='הפעל מערכת';btn.disabled=false;
    err.textContent='לא הצלחתי לפתוח מצלמה או לטעון את זיהוי הידיים: '+(e.message||e)+' — תוודא שאישרת מצלמה ושיש אינטרנט.';
  }
};
document.getElementById('add').onclick=()=>balls.push(makeBall(balls.length));
document.getElementById('reset').onclick=reset;
document.getElementById('cam').onclick=()=>showCam=!showCam;
requestAnimationFrame(loop);
</script>
</body>
</html>
